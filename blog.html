<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="./public/styles/styles.css">
</head>

<body>
  <header>
    
    <form action="/remove-blog" method="delete" accept-charset="utf-8">
      <button type="submit" class="cta-btn cta-btn-reading">Delete Blog</button>
    </form>
    
    <p class="nav-logo">My Blog</p>
    
      <form action="/post-blog" method="post" accept-charset="utf-8">
        <button type="submit" class="cta-btn cta-btn-save">Post Blog</button>
      </form>
  </header>
<div class="editing-view-container">
  <textarea name="blog-title" id="blogTitle" rows="1" placeholder="Title"></textarea>
  <textarea name="blog-description" id="blogDescription" rows="20"></textarea>
</div>

<script src="../public/js/script.js" type="text/javascript" charset="utf-8"></script>
</body>
</html>
